# Chat answer quality benchmark: 3 prompt variants x 2 candidate models
# Judge: GPT-5.1 (OpenAI)
# Evaluates how well each model synthesizes review data into helpful answers

[run]
dataset = "tooling/benchmarks/datasets/bench_v1"
suite = "core"
seed = 42
max_concurrency = 4
timeout_s = 120
retries = 2
cache_db = "tooling/benchmarks/.cache/cache.sqlite"
results_dir = "tooling/benchmarks/results"
tasks = [
    "chat_answer",
    "chat_answer_v2",
    "chat_answer_v3",
]

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.xai]
api_key_env = "XAI_API_KEY"

[judge]
provider = "openai"
model = "gpt-5.1"
temperature = 0.0
max_tokens = 8192

[[models]]
id = "google:gemini-flash-lite-latest"
provider = "google"
model = "gemini-flash-lite-latest"
temperature = 0.3
max_tokens = 4096

[[models]]
id = "xai:grok-4-1-fast-reasoning"
provider = "openai"
model = "grok-4-1-fast-reasoning"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
temperature = 0.3
max_tokens = 4096
