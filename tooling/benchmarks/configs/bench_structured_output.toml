# Benchmark: Structured output test
# Test gemini-flash-lite + grok models with JSON schema constrained decoding
# Uses v1 dataset, classification tasks (batch + single), judged by gpt-5.1
# Google: uses response_json_schema in config (constrained decoding)
# xAI: uses native xai_sdk chat.parse() with Pydantic models

[run]
dataset = "tooling/benchmarks/datasets/bench_v1"
suite = "core"
seed = 42
max_concurrency = 4
timeout_s = 90
retries = 2
cache_db = "tooling/benchmarks/.cache/cache.sqlite"
results_dir = "tooling/benchmarks/results"
pricing_table = "tooling/benchmarks/pricing/prices.example.json"
no_cache = true
tasks = [
    "review_labeling_batch",
    "review_labeling",
]

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.xai]
api_key_env = "XAI_API_KEY"

[providers.google]
api_key_env = "GEMINI_API_KEY"

[judge]
provider = "openai"
model = "gpt-5.1"
temperature = 0.0

[[models]]
id = "google:gemini-flash-lite-latest"
provider = "google"
model = "gemini-flash-lite-latest"
temperature = 0.2

[[models]]
id = "xai:grok-4-1-fast-reasoning"
provider = "xai"
model = "grok-4-1-fast-reasoning"
temperature = 0.2

[[models]]
id = "xai:grok-4-1-fast-non-reasoning"
provider = "xai"
model = "grok-4-1-fast-non-reasoning"
temperature = 0.2
