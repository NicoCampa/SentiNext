# Prompt Optimization Benchmark: v1 vs v2 vs v3 classification prompts
# Uses bench_v1 dataset (3000 reviews: Silksong, Cyberpunk 2077, Project Motor Racing)
# Tests single + batch classification across prompt versions
# Judge: OpenAI GPT 5.1

[run]
dataset = "tooling/benchmarks/datasets/bench_v1"
suite = "quick"
seed = 42
max_concurrency = 4
timeout_s = 90
retries = 2
cache_db = "tooling/benchmarks/.cache/cache.sqlite"
results_dir = "tooling/benchmarks/results"
pricing_table = "tooling/benchmarks/pricing/prices.example.json"
tasks = [
    # Original prompts (v1)
    "review_labeling",
    "review_labeling_batch",
    # Improved v2: chain-of-thought style, role-based, added mod disambiguation
    "review_labeling_v2",
    "review_labeling_batch_v2",
    # Improved v3: ultra-compact, minimal tokens, pipe-separated taxonomy
    "review_labeling_v3",
    "review_labeling_batch_v3",
]

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.xai]
api_key_env = "XAI_API_KEY"

[judge]
provider = "openai"
model = "gpt-5.1"
temperature = 0.0
max_tokens = 8192

# Test with the production model (Grok non-reasoning)
[[models]]
id = "xai:grok-4-1-fast-non-reasoning"
provider = "openai"
model = "grok-4-1-fast-non-reasoning"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
temperature = 0.2
