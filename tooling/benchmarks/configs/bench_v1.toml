# Benchmark v1: Mixed dataset (fresh classification + cached downstream tasks)
# Dataset: bench_v1 (Cyberpunk 2077, Hollow Knight: Silksong, Project Motor Racing)
#   - Classification: all 3 games (batch format, 3 reviews/prompt)
#   - Summarization: Cyberpunk + Silksong (cached flash-2.5 labels)
#   - Executive reports: Motor Racing (cached flash-2.5 labels)
#   - Compare games: Silksong vs Cyberpunk (cached flash-2.5 labels)
#   - Translation: skipped

[run]
dataset = "tooling/benchmarks/datasets/bench_v1"
suite = "core"                # quick | core | full
seed = 42
max_concurrency = 4
timeout_s = 90
retries = 2
cache_db = "tooling/benchmarks/.cache/cache.sqlite"
results_dir = "tooling/benchmarks/results"
pricing_table = "tooling/benchmarks/pricing/prices.example.json"
tasks = [
    "review_labeling_batch",          # all 3 games, 60 reviews
    "subcategory_summary",
    "monthly_report_summary",
    "compare_games_overview",
]

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.xai]
api_key_env = "XAI_API_KEY"

[providers.ollama]
base_url = "http://localhost:11434/v1"

[providers.google]
api_key_env = "GEMINI_API_KEY"

[judge]
provider = "openai"
model = "gpt-5.1"
temperature = 0.0

[[models]]
id = "openai:gpt-5.1"
provider = "openai"
model = "gpt-5.1"
temperature = 0.2

[[models]]
id = "openai:gpt-5-mini"
provider = "openai"
model = "gpt-5-mini"
temperature = 0.2

[[models]]
id = "google:gemini-2.5-flash"
provider = "google"
model = "gemini-2.5-flash"
temperature = 0.2

[[models]]
id = "google:gemini-flash-lite-latest"
provider = "google"
model = "gemini-flash-lite-latest"
temperature = 0.2

[[models]]
id = "xai:grok-4-1-fast-reasoning"
provider = "openai"
model = "grok-4-1-fast-reasoning"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
temperature = 0.2

[[models]]
id = "xai:grok-4-1-fast-non-reasoning"
provider = "openai"
model = "grok-4-1-fast-non-reasoning"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
temperature = 0.2

[[models]]
id = "openai:gpt-5-nano"
provider = "openai"
model = "gpt-5-nano"
temperature = 0.2

[[models]]
id = "ollama:gpt-oss-120b-cloud"
provider = "ollama"
model = "gpt-oss:120b-cloud"
temperature = 0.2
