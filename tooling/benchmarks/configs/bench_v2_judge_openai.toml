# Benchmark v2: Classification-only, judged by gpt-5.1
# 3 candidate models, batch (20x3) + single (60x1) classification

[run]
dataset = "tooling/benchmarks/datasets/bench_v2"
suite = "core"
seed = 42
max_concurrency = 4
timeout_s = 90
retries = 2
cache_db = "tooling/benchmarks/.cache/cache.sqlite"
results_dir = "tooling/benchmarks/results"
pricing_table = "tooling/benchmarks/pricing/prices.example.json"
tasks = [
    "review_labeling_batch",
    "review_labeling",
]

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.xai]
api_key_env = "XAI_API_KEY"

[judge]
provider = "openai"
model = "gpt-5.1"
temperature = 0.0

[[models]]
id = "openai:gpt-5-nano"
provider = "openai"
model = "gpt-5-nano"
temperature = 0.2

[[models]]
id = "xai:grok-4-1-fast-reasoning"
provider = "openai"
model = "grok-4-1-fast-reasoning"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
temperature = 0.2

[[models]]
id = "xai:grok-4-1-fast-non-reasoning"
provider = "openai"
model = "grok-4-1-fast-non-reasoning"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
temperature = 0.2
