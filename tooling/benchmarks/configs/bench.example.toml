[run]
dataset = "tooling/benchmarks/datasets/synthetic_v1"
suite = "quick"                # quick | core | full
seed = 42
max_concurrency = 4
timeout_s = 60
retries = 2
cache_db = "tooling/benchmarks/.cache/cache.sqlite"
results_dir = "tooling/benchmarks/results"
pricing_table = "tooling/benchmarks/pricing/prices.example.json"

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.xai]
api_key_env = "XAI_API_KEY"

[providers.ollama]
base_url = "http://localhost:11434/v1"

[providers.google]
api_key_env = "GEMINI_API_KEY"

[judge]
# Explicit judge config (required). Set provider+model you want to use as judge.
provider = "openai"
model = "gpt-5.1"
temperature = 0.0
max_tokens = 800

[[models]]
id = "openai:gpt-5-mini"
provider = "openai"
model = "gpt-5-mini"
temperature = 0.2
max_tokens = 800

[[models]]
id = "google:gemini-2.5-flash"
provider = "google"
model = "gemini-2.5-flash"
temperature = 0.2
max_tokens = 800

[[models]]
id = "google:gemini-flash-lite-latest"
provider = "google"
model = "gemini-flash-lite-latest"
temperature = 0.2
max_tokens = 800

[[models]]
id = "ollama:gpt-oss:120b-cloud"
provider = "ollama"
model = "gpt-oss:120b-cloud"
temperature = 0.2
max_tokens = 800

[[models]]
id = "xai:grok-4-1-fast-reasoning"
provider = "xai"
model = "grok-4-1-fast-reasoning"
temperature = 0.2
max_tokens = 800

[[models]]
id = "xai:grok-4-1-fast-non-reasoning"
provider = "xai"
model = "grok-4-1-fast-non-reasoning"
temperature = 0.2
max_tokens = 800

[[models]]
id = "openai:gpt-5-nano"
provider = "openai"
model = "gpt-5-nano"
temperature = 0.2
max_tokens = 800
