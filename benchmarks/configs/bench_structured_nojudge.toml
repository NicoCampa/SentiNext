# Benchmark: Structured output test — no real judge (mock judge)
# Tests JSON validity of structured outputs. Candidate outputs are cached
# so you can re-run with a real judge later.
# Google: uses response_json_schema in config (constrained decoding)
# xAI: uses native xai_sdk chat.parse() with Pydantic models

[run]
dataset = "benchmarks/datasets/bench_v1"
suite = "core"
seed = 42
max_concurrency = 4
timeout_s = 90
retries = 2
cache_db = "benchmarks/.cache/cache.sqlite"
results_dir = "benchmarks/results"
pricing_table = "benchmarks/pricing/prices.example.json"
no_cache = true
tasks = [
    "review_labeling_batch",
    "review_labeling",
]

[providers.xai]
api_key_env = "XAI_API_KEY"

[providers.google]
api_key_env = "GEMINI_API_KEY"

[judge]
provider = "mock"
model = "mock-judge"
temperature = 0.0

[[models]]
id = "google:gemini-flash-lite-latest"
provider = "google"
model = "gemini-flash-lite-latest"
temperature = 0.2

[[models]]
id = "xai:grok-4-1-fast-reasoning"
provider = "xai"
model = "grok-4-1-fast-reasoning"
temperature = 0.1

[[models]]
id = "xai:grok-4-1-fast-non-reasoning"
provider = "xai"
model = "grok-4-1-fast-non-reasoning"
temperature = 0.1
