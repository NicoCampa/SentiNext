[run]
dataset = "benchmarks/datasets/synthetic_v1"
suite = "quick"
seed = 42
max_concurrency = 4
timeout_s = 10
retries = 0
cache_db = "benchmarks/.cache/cache.sqlite"
results_dir = "benchmarks/results"
pricing_table = "benchmarks/pricing/prices.example.json"
no_cache = true

[judge]
provider = "mock"
model = "mock-judge"
temperature = 0.0
max_tokens = 800

[[models]]
id = "mock:candidate"
provider = "mock"
model = "mock-candidate"
temperature = 0.2
max_tokens = 800
