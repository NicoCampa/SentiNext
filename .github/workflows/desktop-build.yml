name: Desktop Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace('v', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseName = `SentiNext Desktop v${version}`;
            const releaseBody = [
              `## SentiNext Desktop v${version}`,
              '',
              'Download the installer for your platform below.',
              '',
              '| Platform | File |',
              '|----------|------|',
              '| macOS (Apple Silicon) | `.dmg` |',
              '| Windows (x64) | `.exe` |',
            ].join('\n');

            let release;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              release = data;

              const shouldUpdateMetadata =
                release.name !== releaseName || release.body !== releaseBody;

              if (shouldUpdateMetadata) {
                const { data: updated } = await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.id,
                  name: releaseName,
                  body: releaseBody,
                });
                release = updated;
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              try {
                const { data } = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  name: releaseName,
                  body: releaseBody,
                  draft: true,
                  prerelease: false,
                });
                release = data;
              } catch (createError) {
                // Handle race conditions where another run created the release after our initial lookup.
                if (createError.status === 422) {
                  const { data: existing } = await github.rest.repos.getReleaseByTag({
                    owner,
                    repo,
                    tag,
                  });
                  release = existing;
                } else {
                  throw createError;
                }
              }
            }

            return String(release.id);

  build:
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # macOS: Import signing certificate
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm certificate.p12

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg || true

      # Build static frontend
      - name: Install frontend dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Build static frontend
        working-directory: apps/dashboard
        run: npm run build:desktop

      # Build PyInstaller sidecar
      - name: Install Python dependencies
        run: pip install -r apps/desktop/pyinstaller/requirements-desktop.txt

      - name: Build sidecar binary
        run: python apps/desktop/pyinstaller/build.py --target-triple ${{ matrix.target }}

      # Build Tauri app (with signing on macOS)
      - name: Install Tauri CLI
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_BUILD: "1"
          # macOS signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.rust-target }}
          releaseId: ${{ needs.create-release.outputs.release_id || '' }}

      # Upload as artifacts
      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SentiNext-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SentiNext-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.create-release.result == 'success' && needs.build.result == 'success'
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const releaseIdRaw = '${{ needs.create-release.outputs.release_id }}'.trim();
            let release;

            if (releaseIdRaw) {
              const releaseId = Number(releaseIdRaw);
              if (!Number.isFinite(releaseId)) {
                throw new Error(`Invalid release id output: "${releaseIdRaw}"`);
              }
              const { data } = await github.rest.repos.getRelease({
                owner,
                repo,
                release_id: releaseId,
              });
              release = data;
            } else {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              release = data;
            }

            if (!release.draft) {
              console.log(`Release ${release.tag_name} is already published. Nothing to do.`);
              return;
            }

            try {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                draft: false,
              });
            } catch (error) {
              // Reruns can race with another publish path. If tag already has a published release, treat as success.
              if (error.status === 422) {
                const { data: existing } = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag,
                });
                if (!existing.draft) {
                  console.log(`Release ${existing.tag_name} already published via another path.`);
                  return;
                }
              }
              throw error;
            }
