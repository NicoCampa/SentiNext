services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sentinext
      POSTGRES_USER: sentinext
      POSTGRES_PASSWORD: sentinext
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://sentinext:sentinext@db:5432/sentinext
      SENTINEXT_AUTH_ENABLED: "false"
      SENTINEXT_ADMIN_USER_IDS: "local"
      SENTINEXT_ALLOWED_ORIGINS: "http://localhost:3000"
    env_file:
      - path: .env.local
        required: false
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
