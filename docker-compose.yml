services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sentinext
      POSTGRES_USER: sentinext
      POSTGRES_PASSWORD: sentinext
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinext"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sentinext:sentinext@db:5432/sentinext
      SENTINEXT_ALLOWED_ORIGINS: "http://localhost:3000"
    env_file:
      - path: .env.local
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # Optional: Ollama for local LLM inference
  # Uncomment to use Ollama as your LLM provider
  # ollama:
  #   image: ollama/ollama
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   ports:
  #     - "11434:11434"

volumes:
  pgdata:
  appdata:
  # ollama_data:
