version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - SENTINEXT_OLLAMA_MODEL=${SENTINEXT_OLLAMA_MODEL:-gpt-oss:20b-cloud}
      - SENTINEXT_CLUSTER_LABELS=${SENTINEXT_CLUSTER_LABELS:-true}
      - SENTINEXT_CLUSTER_SIMILARITY=${SENTINEXT_CLUSTER_SIMILARITY:-0.82}
      - SENTINEXT_DB_PATH=/app/data/senti_next.db
      - SENTINEXT_ENABLE_DESTRUCTIVE=${SENTINEXT_ENABLE_DESTRUCTIVE:-false}
      - SENTINEXT_ADMIN_TOKEN=${SENTINEXT_ADMIN_TOKEN:-}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
